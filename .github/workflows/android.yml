name: Build APEX Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get APEX source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.apexkart

      - name: Install dependencies
        run: flutter pub get
        
      - name: Remove generated default test
        run: rm -rf test
        
      - name: Analyze project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APEX APK
        uses: actions/upload-artifact@v4
        with:
          name: APEX-Kart-AI-v0.1
          path: build/app/outputs/flutter-apk/app-release.apk
